name: Validate recovered Atlas article pages
on:
  pull_request:
    paths:
      - mable-research.html
      - journey.html
      - royale-guide.html
      - royale-guide.css
      - royale-guide.js
      - tests/royale_recovered.test.mjs
      - journey.css
      - journey.js
      - tests/journey_recovered.test.mjs
      - shiny-hunting.html
      - boss-guide.html
      - boss-guide.css
      - boss-guide.js
      - boss-guide-data.js
      - tests/boss_recovered.test.mjs
      - type-chart.html
      - type-chart.css
      - type-chart.js
      - type-chart-data.js
      - tests/type_chart_recovered.test.mjs
      - alphas.html
      - alphas.css
      - alphas.js
      - tests/alphas_recovered.test.mjs
      - shops.html
      - shops.css
      - shops.js
      - shops-data.js
      - tests/shops_recovered.test.mjs
      - maps.html
      - maps.css
      - maps.js
      - tests/maps_recovered.test.mjs
      - items.html
      - items.css
      - items.js
      - items-data.js
      - tests/items_recovered.test.mjs
      - tests/items_checkoff.test.mjs
      - legendaries.html
      - legendaries.css
      - legendaries.js
      - legendaries-data.js
      - tests/legendaries_recovered.test.mjs
      - home-connection.html
      - home-connection.css
      - home-connection.js
      - home-dex-data.js
      - tests/home_recovered.test.mjs
      - rewards.html
      - rewards-guide.css
      - tests/rewards_recovered.test.mjs
      - battles.html
      - battles-guide.css
      - tests/battles_recovered.test.mjs
      - walkthrough.html
      - index.html
      - src/template.html
      - coverage.html
      - coverage.css
      - tests/sitewide_link_graph.test.mjs
      - tests/coverage_navigation.test.mjs
      - src/sections/walkthrough.html
      - tests/mission37_ally_wave.test.mjs
      - tests/mission24_25_source_parity.test.mjs
      - tests/journey_deep_links.test.mjs
      - walkthrough-index.css
      - walkthrough-index.js
      - tests/walkthrough_index.test.mjs
      - side-missions.html
      - side-missions-index.css
      - side-missions-index.js
      - tests/side_missions_index.test.mjs
      - mega-dimension.html
      - mega-dimension-index.css
      - tests/mega_dimension_index.test.mjs
      - sector-maps.html
      - sector-maps.css
      - sector-maps.js
      - tests/sector_map_directory.test.mjs
      - tests/sector_photo_landmarks.test.mjs
      - tests/approx_item_map_leads.test.mjs
      - hyperspace-maps.html
      - hyperspace-maps-guide.css
      - tests/hyperspace_map_navigation.test.mjs
      - shiny-hunting.css
      - shiny-hunting.js
      - tests/shiny_recovered.test.mjs
      - recovered-articles.css
      - recovered-articles.js
      - tests/mable_recovered.test.mjs
      - .github/workflows/validate-recovered-articles.yml

permissions:
  contents: read

jobs:
  recovered-articles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify article JS syntax
        run: node --check recovered-articles.js
      - name: Verify original PDF reward order, menu, safe local state and navigation
        run: node --test tests/mable_recovered.test.mjs
      - name: Verify shiny calculator JavaScript syntax
        run: node --check shiny-hunting.js
      - name: Verify Shiny hunting article, links and odds estimator
        run: node --test tests/shiny_recovered.test.mjs
      - name: Verify Complete Journey JavaScript syntax
        run: node --check journey.js
      - name: Verify full 46-page Journey route and search controls
        run: node --test tests/journey_recovered.test.mjs
      - name: Check restored Royale script syntax
        run: node --check royale-guide.js
      - name: Verify 10 promotion teams, illustrations and search navigation
        run: node --test tests/royale_recovered.test.mjs
      - name: Verify boss guide JavaScript syntax
        run: node --check boss-guide.js && node --check boss-guide-data.js
      - name: Verify boss PDF data, 25-link menu and offline filters
        run: node --test tests/boss_recovered.test.mjs
      - name: Check complete type chart JavaScript syntax
        run: node --check type-chart.js && node --check type-chart-data.js
      - name: Test 18-type PDF fidelity, 324 matchups and offline calculator
        run: node --test tests/type_chart_recovered.test.mjs
      - name: Check Alpha fieldbook JavaScript syntax
        run: node --check alphas.js
      - name: Compare 20 source zone cards, Zone 20 pool and search behaviour
        run: node --test tests/alphas_recovered.test.mjs
      - name: Validate shops catalog and planner JavaScript
        run: node --check shops.js && node --check shops-data.js
      - name: Verify 190 PDF shop entries, currencies and offline calculators
        run: node --test tests/shops_recovered.test.mjs
      - name: Check maps interaction JavaScript syntax
        run: node --check maps.js
      - name: Verify 20 map pins, saved item and Alpha clues, navigation and zoom
        run: node --test tests/maps_recovered.test.mjs
      - name: Check Item Atlas interaction and source-data JavaScript syntax
        run: node --check items.js && node --check items-data.js
      - name: Compare all 264 PDF items, 100 screws and 48 verified sector names
        run: node --test tests/items_recovered.test.mjs
      - name: Verify 364 checkboxes share existing guide progress without resetting other data
        run: node --test tests/items_checkoff.test.mjs
      - name: Check Legendary route and artwork data JavaScript syntax
        run: node --check legendaries.js && node --check legendaries-data.js
      - name: Verify 25 exact original Legendary cards and shared progress
        run: node --test tests/legendaries_recovered.test.mjs
      - name: Check Pokémon HOME catalogue and search JavaScript syntax
        run: node --check home-connection.js && node --check home-dex-data.js
      - name: Verify 364 original PDF entries, 256 local artworks, 108 disclosed fallbacks and safe registration tracker
        run: node --test tests/home_recovered.test.mjs
      - name: Verify PDF-backed Online Rewards source, images, menu and mobile navigation
        run: node --test tests/rewards_recovered.test.mjs
      - name: Verify PDF-backed Ranked Battles page, Season X table and mobile navigation
        run: node --test tests/battles_recovered.test.mjs
      - name: Reject broken local guide anchors and raw Markdown destinations across every page
        run: node --test tests/sitewide_link_graph.test.mjs
      - name: Verify coverage HTML, original 25-link menu, generated-source parity and no raw Markdown navigation
        run: node --test tests/coverage_navigation.test.mjs
      - name: Verify 42 source mission guides, no progress writes, navigation and mobile layout
        run: node --test tests/walkthrough_index.test.mjs
      - name: Check all 48 Walkthrough to Complete Journey mission links and untouched player progress
        run: node --test tests/journey_deep_links.test.mjs
      - name: Check Mission 24-25 original story, types, full teams and untouched player progress
        run: node --test tests/mission24_25_source_parity.test.mjs
      - name: Verify Mission 37 Ivor/Gwynn three-Mega guidance and 17-section rebuild parity
        run: node --test tests/mission37_ally_wave.test.mjs
      - name: Verify all 203 saved side quests, EX links, filters, and read-only progress
        run: node --test tests/side_missions_index.test.mjs
      - name: Verify source-exact 14 Mega Dimension DLC mission routes
        run: node --test tests/mega_dimension_index.test.mjs
      - name: Validate sector map directory JavaScript syntax
        run: node --check sector-maps.js
      - name: Verify 48 sectors, 20 source-positioned Wild Zones, 264 numbered items, 100 source Screws and read-only progress
        run: node --test tests/sector_map_directory.test.mjs
      - name: Verify ten player-supplied screenshot district landmark anchors and no false item pins
        run: node --test tests/sector_photo_landmarks.test.mjs
      - name: Verify 146 numbered source-saved approximate map leads without inventing confirmed pins
        run: node --test tests/approx_item_map_leads.test.mjs
      - name: Verify final Hyperspace Maps navigation without missing-map fabrication or source loss
        run: node --test tests/hyperspace_map_navigation.test.mjs
      - name: Verify existing 17-section static site remains unchanged and valid
        run: python3 tests/validate_static.py
      - name: Guard against feedback form regression
        run: node --test tests/feedback_standalone.test.mjs
