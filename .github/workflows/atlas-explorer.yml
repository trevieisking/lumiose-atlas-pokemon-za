name: Validate rotatable Lumiose Atlas Explorer
on:
  pull_request:
    paths:
      - atlas-explorer.html
      - atlas-explorer.css
      - atlas-explorer.js
      - index.html
      - app.js
      - src/template.html
      - coverage.html
      - coverage.css
      - tests/sitewide_link_graph.test.mjs
      - tests/coverage_navigation.test.mjs
      - src/sections/walkthrough.html
      - walkthrough.html
      - journey.html
      - mega-dimension.html
      - tests/mega_dimension_index.test.mjs
      - journey.js
      - tests/mission37_ally_wave.test.mjs
      - tests/mission24_25_source_parity.test.mjs
      - atlas-explorer-geometry.mjs
      - atlas-guide-links.mjs
      - tests/atlas_guide_links.test.mjs
      - atlas-explorer-data.json
      - atlas-area-model.mjs
      - atlas-area-ui.mjs
      - atlas-area-surfaces.mjs
      - atlas-area-evidence.json
      - atlas-area.css
      - tests/atlas_area_model.test.mjs
      - tests/atlas_area_evidence.test.mjs
      - tests/atlas_area_browser.mjs
      - 'docs/qa/ATLAS_AT339_*'
      - 'docs/qa/at339-encounters/**'
      - 'docs/qa/at339-geometry/**'
      - 'docs/qa/candidates/wz04-2026-11-26/**'
      - atlas-collectibles.mjs
      - atlas-collectibles-ui.mjs
      - atlas-collectibles-data.json
      - items-data.js
      - tests/atlas_collectibles.test.mjs
      - tests/atlas_collectibles_browser.mjs
      - sector-maps.js
      - sector-maps.css
      - tests/sector_map_directory.test.mjs
      - tests/maps_recovered.test.mjs
      - tests/atlas_explorer.test.mjs
      - tests/atlas_explorer_browser.mjs
      - .github/workflows/atlas-explorer.yml
      - maps.html
      - maps.js
      - 'assets/atlas/wild-zones/**'
      - 'assets/atlas/city-overview/owner-crops-2026-11-26/**'
      - docs/qa/ATLAS_WZ05_OWNER_OVERVIEW_OUTLINE.json
      - docs/qa/ATLAS_EARLY_ZONE_OUTLINE_SCREENING.json
      - tests/validate_owner_overview_evidence.py
      - 'assets/atlas/sector-streets/**'
      - maps/lumiose-game-map.jpg
      - wild-zone-fieldbook.mjs
      - wild-zone-fieldbook.css
      - tests/wild_zone_fieldbook.test.mjs
      - tests/wild_zone_fieldbook_browser.mjs
      - reconstruction.css
      - sector-maps.html
      - holovator-map.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check isolated map modules
        run: node --check atlas-explorer-geometry.mjs && node --check atlas-explorer.js && node --check atlas-collectibles.mjs && node --check atlas-collectibles-ui.mjs && node --check tests/atlas_collectibles_browser.mjs && node --check atlas-area-model.mjs && node --check atlas-area-ui.mjs && node --check atlas-area-surfaces.mjs && node --check tests/atlas_area_browser.mjs && node --check sector-maps.js && node --check maps.js && node --check app.js
      - name: Check source counts, actual photos and rotation/floor-route evidence
        run: node --test tests/atlas_explorer.test.mjs tests/sector_map_directory.test.mjs tests/maps_recovered.test.mjs tests/atlas_guide_links.test.mjs
      - name: Gate collectible coordinates, original identities and read-only progress
        run: node --test tests/atlas_collectibles.test.mjs tests/items_checkoff.test.mjs
      - name: Verify owner overview source bytes and keep research out of live geometry
        run: python3 tests/validate_owner_overview_evidence.py
      - name: Verify original Wild Zone photo pairs and roster parity
        run: node --test tests/wild_zone_fieldbook.test.mjs
      - name: Validate shared areas, habitat classes and boundary evidence gates
        run: node --test tests/atlas_area_model.test.mjs tests/atlas_area_evidence.test.mjs
      - name: Keep all 20 DLC deep links valid and all 14 original mission steps unchanged
        run: node --test tests/mega_dimension_index.test.mjs
      - name: Reject broken local guide anchors and raw Markdown destinations across every page
        run: node --test tests/sitewide_link_graph.test.mjs
      - name: Validate native coverage destination and original 25-link menu
        run: node --test tests/coverage_navigation.test.mjs
      - name: Protect existing guide, checkmarks and map references
        run: python3 tests/validate_static.py
  atlas-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium smoke dependency, without changing package files
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Confirm system Chrome is available for offline-style browser smoke
        id: chrome
        run: command -v google-chrome || command -v google-chrome-stable
      - name: Verify shared habitats, all map views and original progress
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        run: node tests/atlas_area_browser.mjs
      - name: Verify real map and stepwise routes on desktop and phone
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        run: node tests/atlas_explorer_browser.mjs
      - name: Verify compact layers with isolated dense fixtures and unchanged player progress
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        run: node tests/atlas_collectibles_browser.mjs
      - name: Verify all 20 Wild Zone photo panels and four map surfaces
        if: ${{ !cancelled() && steps.chrome.outcome == 'success' }}
        run: node tests/wild_zone_fieldbook_browser.mjs
      - name: Attach screenshot QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-explorer-mobile-desktop-preview
          path: |
            test-artifacts/atlas-explorer/
            test-artifacts/atlas-collectibles/
            test-artifacts/atlas-areas/
          if-no-files-found: ignore
          retention-days: 10
