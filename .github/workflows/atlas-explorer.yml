name: Validate rotatable Lumiose Atlas Explorer
on:
  pull_request:
    paths:
      - atlas-explorer.html
      - atlas-explorer.css
      - atlas-explorer.js
      - index.html
      - app.js
      - src/template.html
      - coverage.html
      - coverage.css
      - tests/sitewide_link_graph.test.mjs
      - tests/coverage_navigation.test.mjs
      - src/sections/walkthrough.html
      - walkthrough.html
      - journey.html
      - mega-dimension.html
      - tests/mega_dimension_index.test.mjs
      - journey.js
      - tests/mission37_ally_wave.test.mjs
      - tests/mission24_25_source_parity.test.mjs
      - atlas-explorer-geometry.mjs
      - atlas-guide-links.mjs
      - tests/atlas_guide_links.test.mjs
      - atlas-explorer-data.json
      - sector-maps.js
      - sector-maps.css
      - tests/sector_map_directory.test.mjs
      - tests/maps_recovered.test.mjs
      - tests/atlas_explorer.test.mjs
      - tests/atlas_explorer_browser.mjs
      - .github/workflows/atlas-explorer.yml
      - maps.html
      - maps.js
      - 'assets/atlas/wild-zones/**'
      - wild-zone-fieldbook.mjs
      - wild-zone-fieldbook.css
      - tests/wild_zone_fieldbook.test.mjs
      - tests/wild_zone_fieldbook_browser.mjs
      - reconstruction.css
      - sector-maps.html
      - holovator-map.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check isolated map modules
        run: node --check atlas-explorer-geometry.mjs && node --check atlas-explorer.js && node --check sector-maps.js && node --check maps.js && node --check app.js
      - name: Check source counts, actual photos and rotation/floor-route evidence
        run: node --test tests/atlas_explorer.test.mjs tests/sector_map_directory.test.mjs tests/maps_recovered.test.mjs tests/atlas_guide_links.test.mjs
      - name: Verify original Wild Zone photo pairs and roster parity
        run: node --test tests/wild_zone_fieldbook.test.mjs
      - name: Keep all 20 DLC deep links valid and all 14 original mission steps unchanged
        run: node --test tests/mega_dimension_index.test.mjs
      - name: Reject broken local guide anchors and raw Markdown destinations across every page
        run: node --test tests/sitewide_link_graph.test.mjs
      - name: Validate native coverage destination and original 25-link menu
        run: node --test tests/coverage_navigation.test.mjs
      - name: Protect existing guide, checkmarks and map references
        run: python3 tests/validate_static.py
  atlas-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium smoke dependency, without changing package files
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Confirm system Chrome is available for offline-style browser smoke
        run: command -v google-chrome || command -v google-chrome-stable
      - name: Verify real map and stepwise routes on desktop and phone
        run: node tests/atlas_explorer_browser.mjs
      - name: Verify all 20 Wild Zone photo panels and four map surfaces
        run: node tests/wild_zone_fieldbook_browser.mjs
      - name: Attach screenshot QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-explorer-mobile-desktop-preview
          path: test-artifacts/atlas-explorer/
          if-no-files-found: ignore
          retention-days: 10
