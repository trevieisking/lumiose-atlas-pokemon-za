name: Validate reconstruction (no deploy)
on:
  push:
  pull_request:
jobs:
  static-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build static homepage
        run: python3 scripts/build.py
      - name: Verify contents and links
        run: python3 tests/validate_static.py
      - name: Confirm reproducible generated page
        run: git diff --exit-code -- index.html
